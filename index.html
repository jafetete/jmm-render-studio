                        { title: 'Levantamiento arquitectónico en sitio', desc: 'Mediciones exactas y digitalización del estado actual de tu proyecto.' },
                        { title: 'Renderizado 3D y Soluciones', desc: 'Renders fotorrealistas con iluminación y texturas de alta calidad.' },
                        { title: 'Diseño y fabricación de mobiliario', desc: 'Piezas personalizadas que se adaptan perfectamente a tus espacios.' },
                        { title: 'Inspección y gestión de permisos', desc: 'Asesoría y control de calidad cumpliendo con las normativas vigentes.' }
                    ], 
                    srvTitle: 'Servicios', srvDesc: 'Soluciones técnicas y visuales para llevar tu proyecto desde la idea inicial hasta la ejecución.', srvB1: 'Alta precisión y detalle técnico.', srvB2: 'Entregas en formatos estándar de la industria.' 
                },
                portfolio: { title: 'Portafolio', desc: 'La precisión de nuestros modelados reflejada en cada detalle, material e iluminación.', featTitle: 'Proyectos Destacados', featBtn: 'Ver Galería Completa', filters: { all: 'Todos', residencial: 'Residencial', various: 'Varios' }, virtualTitle: 'Recorridos Virtuales', virtualSub: 'Recorrido 3D fotorrealista', vTours: [{ title: 'Recorrido Proyecto Residencial 1', url: 'https://youtu.be/coMhTqO_bIQ' }, { title: 'Recorrido Proyecto Residencial 2', url: 'https://youtu.be/Dy0d2S3nLaM' }, { title: 'Recorrido Proyecto Residencial 3', url: 'https://youtu.be/BvsUa62yJNE' }], btnWatch: 'Ver en YouTube' },

        function App() {
          const [currentPage, setCurrentPage] = useState('home');
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          const [activeProject, setActiveProject] = useState(null);
          const [currentImageIndex, setCurrentImageIndex] = useState(0);
          const [lang, setLang] = useState('en');

          const t = TRANSLATIONS[lang];

          useEffect(() => {
            window.scrollTo(0, 0);
          }, [currentPage]);

          const navigateTo = (page) => {
            setCurrentPage(page);
            setIsMobileMenuOpen(false);
          };

          const toggleLanguage = () => {
            setLang(prev => prev === 'en' ? 'es' : 'en');
          };

          const openGallery = (project) => {
            setActiveProject(project);
            setCurrentImageIndex(0);
          };

          const closeGallery = () => setActiveProject(null);

          const nextImage = (e) => {
            e.stopPropagation();
            if (activeProject && activeProject.gallery.length > 0) {
              setCurrentImageIndex((prev) => (prev === activeProject.gallery.length - 1 ? 0 : prev + 1));
            }
          };

          const prevImage = (e) => {
            e.stopPropagation();
            if (activeProject && activeProject.gallery.length > 0) {
              setCurrentImageIndex((prev) => (prev === 0 ? activeProject.gallery.length - 1 : prev - 1));
            }
          };

          return (
            <div className="min-h-screen bg-neutral-900 text-neutral-100 font-sans selection:bg-teal-500 selection:text-white">

                        <span className="block text-xs md:text-sm text-neutral-400 tracking-widest uppercase mt-[-4px]">Render Studio</span>

                    </div>

                    <div className="hidden md:flex items-center space-x-8">

                          key={page}
                          onClick={() => navigateTo(page)}
                          className={`text-sm tracking-wide uppercase font-medium transition-colors hover:text-teal-400 ${
                            currentPage === page ? 'text-teal-500' : 'text-neutral-300'
                          }`}
                        >
                          {t.nav[page]}
                        </button>
                      ))}
                      <div className="h-5 w-px bg-neutral-700 mx-2"></div>
                      <button onClick={toggleLanguage} className="flex items-center text-sm font-bold text-teal-400 hover:text-white transition-colors">
                        <Globe size={18} className="mr-1.5" /> {lang === 'en' ? 'ES' : 'EN'}
                      </button>
                    </div>

                    <div className="md:hidden flex items-center space-x-6">
                      <button onClick={toggleLanguage} className="flex items-center text-sm font-bold text-teal-400 hover:text-white">
                        <Globe size={18} className="mr-1.5" /> {lang === 'en' ? 'ES' : 'EN'}
                      </button>
                      <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-neutral-300 hover:text-white">
                        {isMobileMenuOpen ? <X size={32} /> : <Menu size={32} />}
                      </button>
                    </div>
                  </div>
                </div>

                {isMobileMenuOpen && (
                  <div className="md:hidden bg-neutral-950 border-b border-neutral-800">

                      {['home', 'portfolio', 'services', 'about', 'contact'].map((page) => (
                        <button
                          key={page}
                          onClick={() => navigateTo(page)}
                          className={`block w-full text-left px-4 py-5 text-base tracking-wide uppercase font-medium ${
                            currentPage === page ? 'text-teal-500 bg-neutral-900' : 'text-neutral-300 hover:text-white hover:bg-neutral-800'
                          }`}
                        >
                          {t.nav[page]}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </nav>

              <main className="pt-24 md:pt-28">
                {currentPage === 'home' && <HomeView navigateTo={navigateTo} t={t} />}
                {currentPage === 'portfolio' && <PortfolioView openGallery={openGallery} t={t} />}
                {currentPage === 'services' && <ServicesView t={t} />}
                {currentPage === 'about' && <AboutView t={t} />}
                {currentPage === 'contact' && <ContactView t={t} />}
              </main>

              <footer className="bg-teal-800 text-teal-50 pt-20 pb-8">

                    <div className="flex flex-col items-center md:items-start text-center md:text-left">
                      <div className="mb-6">
                        <img src="Logo-JMM.png" alt="JMM Logo" className="h-28 md:h-36 w-auto invert opacity-100 transition-opacity" />
                      </div>
                      <p className="text-teal-100/80 mb-8 text-sm leading-relaxed max-w-sm mt-4">
                        {t.footer.desc}
                      </p>
                    </div>
                    
                    <div>
                      <h4 className="text-lg font-semibold text-white mb-6 uppercase tracking-wider">{t.footer.links}</h4>
                      <ul className="space-y-4">
                        {['home', 'portfolio', 'services', 'about', 'contact'].map((page) => (
                          <li key={page}>
                            <button onClick={() => navigateTo(page)} className="text-teal-100/80 hover:text-white transition-colors text-sm uppercase tracking-wide">
                              {t.nav[page]}
                            </button>
                          </li>
                        ))}
                      </ul>
                    </div>

                    <div>
                      <h4 className="text-lg font-semibold text-white mb-6 uppercase tracking-wider">{t.footer.contact}</h4>
                      <ul className="space-y-4 text-sm text-teal-100/90">
                        <li className="flex items-center">
                          <MessageCircle size={18} className="mr-3 text-teal-400 flex-shrink-0" />
                          <a href="https://wa.me/qr/6M5XLFRJM3K6P1" target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">WhatsApp</a>
                        </li>
                        <li className="flex items-center">
                          <Send size={18} className="mr-3 text-teal-400 flex-shrink-0" />
                          <a href="https://t.me/JMM_RENDER_STUDIO" target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">Telegram</a>
                        </li>
                        <li className="flex items-center">
                          <Mail size={18} className="mr-3 text-teal-400 flex-shrink-0" />
                          <a href="mailto:info@jmm-arquitectura.art" className="hover:text-white transition-colors">info@jmm-arquitectura.art</a>
                        </li>
                        <li className="flex items-center">
                          <Instagram size={18} className="mr-3 text-teal-400 flex-shrink-0" />
                          <a href="https://instagram.com/jmm_render_studio" target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">@jmm_render_studio</a>
                        </li>
                        <li className="flex items-center">
                          <Youtube size={18} className="mr-3 text-teal-400 flex-shrink-0" />
                          <a href="https://www.youtube.com/@JMM_CR" target="_blank" rel="noopener noreferrer" className="hover:text-white transition-colors">YouTube</a>
                        </li>
                      </ul>
                    </div>
                  </div>
                  
                  <div className="border-t border-teal-700 pt-10 flex flex-col md:flex-row items-center text-xs text-teal-200/60 gap-8 md:gap-0">
                    <div className="order-3 md:order-1 flex-1 flex justify-center md:justify-start w-full">
                      <p className="text-sm">&copy; {new Date().getFullYear()} JMM Render Studio. {t.footer.rights}</p>
                    </div>
                    
                    <div className="order-1 md:order-2 flex-1 flex items-center justify-center space-x-6 w-full">
                      <span className="uppercase tracking-widest text-xs md:text-sm font-semibold text-teal-400">Powered by</span>
                      <img src="Logo-BCD.png" alt="BCD" className="h-16 md:h-28 w-auto opacity-100 transition-opacity" />
                      <div className="h-12 md:h-20 w-px bg-teal-700"></div>
                      <img src="Logo-SGI.png" alt="SGI" className="h-14 md:h-24 w-auto opacity-100 transition-opacity" />
                    </div>

                    <div className="order-2 md:order-3 flex-1 flex justify-center md:justify-end w-full">
                      <p className="text-sm">{t.footer.design}</p>
                    </div>
                  </div>
                </div>
              </footer>

              {activeProject && (
                <div className="fixed inset-0 z-[100] bg-black/98 flex flex-col items-center justify-center backdrop-blur-sm" onClick={closeGallery}>
                  <button onClick={closeGallery} className="absolute top-6 right-6 text-neutral-400 hover:text-white z-[101] transition-colors bg-black/50 p-2 rounded-full">
                    <X size={32} />
                  </button>

                  {activeProject.gallery.length > 1 && (
                    <>
                      <button onClick={prevImage} className="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-white z-[101] transition-all bg-black/50 hover:bg-teal-600/50 p-3 rounded-full">
                        <ChevronLeft size={36} />
                      </button>
                      <button onClick={nextImage} className="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-white z-[101] transition-all bg-black/50 hover:bg-teal-600/50 p-3 rounded-full">
                        <ChevronRight size={36} />
                      </button>
                    </>
                  )}

                  <div className="relative w-full max-w-[1920px] mx-auto px-0 md:px-20 flex items-center justify-center mt-[-3rem] md:mt-0">
                    <div className="relative w-full h-[75vh] md:h-auto md:aspect-video z-[102] overflow-hidden md:rounded-sm shadow-2xl" onClick={(e) => e.stopPropagation()}>
                      <img src={activeProject.gallery[currentImageIndex]} alt={`${activeProject.title} - View ${currentImageIndex + 1}`} className="w-full h-full object-cover animate-in fade-in duration-300" />
                      <img src="Logo-JMM.png" alt="Watermark" className="absolute bottom-4 right-4 md:bottom-8 md:right-8 h-20 md:h-32 w-auto invert opacity-30 pointer-events-none drop-shadow-2xl" />
                    </div>
                  </div>

                  <div className="absolute bottom-8 left-0 right-0 text-center z-[103]" onClick={(e) => e.stopPropagation()}>
                    <h3 className="text-xl font-bold text-white mb-2">{activeProject.title}</h3>
                    {activeProject.gallery.length > 1 && (
                      <div className="flex items-center justify-center space-x-2 mt-4">
                        {activeProject.gallery.map((_, idx) => (
                          <button 
                            key={idx}
                            onClick={(e) => { e.stopPropagation(); setCurrentImageIndex(idx); }}
                            className={`h-1.5 rounded-full transition-all duration-300 ${currentImageIndex === idx ? 'w-8 bg-teal-500' : 'w-2 bg-neutral-600 hover:bg-neutral-400'}`}
                            aria-label={`Ir a imagen ${idx + 1}`}
                          />
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        }

        function HomeView({ navigateTo, t }) {
          const [currentBg, setCurrentBg] = useState(0);

          useEffect(() => {
            const timer = setInterval(() => {
              setCurrentBg((prev) => (prev + 1) % HERO_IMAGES.length);
            }, 5000);
            return () => clearInterval(timer);
          }, []);

          return (
            <div className="animate-in fade-in duration-700">
              <section className="relative h-[100svh] md:h-[90vh] w-full flex items-center justify-center overflow-hidden">
                <div className="absolute inset-0 bg-neutral-950">
                  {HERO_IMAGES.map((img, index) => (
                    <img 
                      key={index} src={img} alt={`Hero Architectural Render ${index + 1}`} 
                      className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out ${index === currentBg ? 'opacity-60' : 'opacity-0'}`} 
                      loading={index === 0 ? "eager" : "lazy"}
                    />
                  ))}
                  <div className="absolute inset-0 bg-gradient-to-t from-neutral-900 via-neutral-900/40 to-transparent"></div>
                </div>
                
                <div className="relative z-10 text-center px-4 max-w-5xl mx-auto">
                  <h2 className="text-teal-400 font-medium tracking-[0.2em] mb-4 text-sm md:text-base uppercase">{t.hero.sub}</h2>
                  <h1 className="text-4xl md:text-6xl lg:text-7xl font-bold text-white mb-8 leading-tight tracking-tight" dangerouslySetInnerHTML={{ __html: t.hero.title }}></h1>
                  <p className="text-lg md:text-xl text-neutral-300 mb-10 max-w-2xl mx-auto font-light">{t.hero.desc}</p>
                  <button onClick={() => navigateTo('portfolio')} className="bg-teal-600 hover:bg-teal-500 text-white px-8 py-4 rounded-sm font-medium tracking-wide uppercase transition-all flex items-center mx-auto space-x-2 group">
                    <span>{t.hero.btn}</span>
                    <ChevronRight size={18} className="group-hover:translate-x-1 transition-transform" />
                  </button>
                </div>
              </section>

              <section className="py-24 bg-neutral-900 border-b border-neutral-800">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="text-center mb-16">
                    <h3 className="text-3xl font-bold text-white mb-4">{t.services.title}</h3>
                    <div className="w-16 h-1 bg-teal-500 mx-auto"></div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-8">
                    {t.services.items.map((srv, idx) => (
                      <div key={idx} className="flex flex-col items-center text-center group cursor-pointer" onClick={() => navigateTo('services')}>
                        <div className="w-20 h-20 rounded-full bg-neutral-800 flex items-center justify-center text-teal-500 mb-6 group-hover:bg-teal-500 group-hover:text-white transition-all duration-300">
                          {ICONS[idx]}
                        </div>
                        <h4 className="text-neutral-200 font-semibold mb-2 text-sm uppercase tracking-wide">{srv.title}</h4>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              <section className="py-24 bg-neutral-950">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-end mb-12">
                    <div>
                      <h3 className="text-3xl font-bold text-white mb-4">{t.portfolio.featTitle}</h3>
                      <div className="w-16 h-1 bg-teal-500"></div>
                    </div>
                    <button onClick={() => navigateTo('portfolio')} className="hidden md:flex items-center text-teal-400 hover:text-teal-300 font-medium uppercase text-sm tracking-wide group">
                      {t.portfolio.featBtn} <ChevronRight size={16} className="ml-1 group-hover:translate-x-1 transition-transform" />
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {PORTFOLIO_ITEMS.filter(item => [2, 6, 7].includes(item.id)).map((item) => (
                      <div key={item.id} className="group relative overflow-hidden rounded-sm aspect-[4/3] cursor-pointer" onClick={() => navigateTo('portfolio')}>
                        <img src={item.img} alt={item.title} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" loading="lazy" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6">
                          <span className="text-teal-400 text-xs font-bold uppercase tracking-wider mb-1">{t.portfolio.filters[item.category] || item.category}</span>
                          <h4 className="text-white text-xl font-bold">{item.title}</h4>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button onClick={() => navigateTo('portfolio')} className="mt-8 w-full md:hidden border border-teal-600 text-teal-400 py-3 uppercase text-sm font-medium tracking-wide">
                    {t.portfolio.featBtn}
                  </button>
                </div>
              </section>
            </div>
          );
        }

        function PortfolioView({ openGallery, t }) {
          const [filter, setFilter] = useState('all');
          const categories = ['all', 'residential', 'various'];

          const filteredItems = filter === 'all' ? PORTFOLIO_ITEMS : PORTFOLIO_ITEMS.filter(item => item.category === filter);

          return (
            <div className="animate-in fade-in duration-500 bg-neutral-900 min-h-screen">
              <header className="py-20 bg-neutral-950 text-center px-4">
                <h1 className="text-4xl md:text-5xl font-bold text-white mb-4">{t.portfolio.title}</h1>
                <div className="w-16 h-1 bg-teal-500 mx-auto mb-6"></div>
                <p className="text-neutral-400 max-w-2xl mx-auto text-lg">{t.portfolio.desc}</p>
              </header>

              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                <div className="flex flex-wrap justify-center gap-4 mb-12">
                  {categories.map(cat => (
                    <button key={cat} onClick={() => setFilter(cat)} className={`px-6 py-2 rounded-full text-sm font-medium uppercase tracking-wider transition-colors border ${filter === cat ? 'bg-teal-600 border-teal-600 text-white' : 'border-neutral-700 text-neutral-400 hover:border-teal-500 hover:text-teal-400'}`}>
                      {t.portfolio.filters[cat]}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredItems.map(item => (
                    <div key={item.id} className="group relative overflow-hidden bg-neutral-800 rounded-sm aspect-square cursor-pointer" onClick={() => openGallery(item)}>
                      <img src={item.img} alt={item.title} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-80 group-hover:opacity-100" loading="lazy" />
                      
                      <img src="Logo-JMM.png" alt="Watermark" className="absolute bottom-4 right-4 h-8 md:h-12 w-auto invert opacity-30 pointer-events-none z-20 transition-opacity group-hover:opacity-50 drop-shadow-md" />

                      <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center z-30">
                        <div className="text-center transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
                          <Maximize className="text-white mx-auto mb-3" size={32} />
                          <span className="block text-teal-400 text-xs font-bold uppercase tracking-wider mb-1">{t.portfolio.filters[item.category] || item.category}</span>
                          <h4 className="text-white text-xl font-bold px-4">{item.title}</h4>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <section className="bg-neutral-950 py-24">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                  <h3 className="text-3xl font-bold text-white mb-4">{t.portfolio.virtualTitle}</h3>
                  <div className="w-16 h-1 bg-teal-500 mx-auto mb-10"></div>
                  
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    {t.portfolio.vTours.map((tour, idx) => (
                      <div key={idx} className="bg-neutral-900 border border-neutral-800 rounded-sm p-10 flex flex-col items-center justify-center text-center shadow-2xl group hover:border-teal-600 transition-colors">
                        <div className="w-20 h-20 bg-neutral-950 rounded-full flex items-center justify-center text-teal-500 mb-6 group-hover:scale-110 group-hover:bg-teal-500 group-hover:text-white transition-all duration-300 shadow-lg">
                          <Play size={36} className="ml-1" />
                        </div>
                        <h4 className="text-xl font-bold text-white mb-6 leading-relaxed">{tour.title}</h4>
                        <a href={tour.url} target="_blank" rel="noopener noreferrer" className="px-8 py-3 border border-teal-600 text-teal-400 rounded-full text-sm font-medium uppercase tracking-wider hover:bg-teal-600 hover:text-white transition-colors flex items-center">
                          {t.portfolio.btnWatch}
                        </a>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </div>
          );
        }

        function ServicesView({ t }) {
          return (
            <div className="animate-in fade-in duration-500 relative min-h-screen pb-24">
              <div className="fixed inset-0 z-[-1] bg-neutral-950">
                <img 
                  src="Portada-2.png" alt="Background" 
                  className="absolute inset-0 w-full h-full object-cover opacity-20 blur-sm scale-105" 
                />
                <div className="absolute inset-0 bg-gradient-to-b from-neutral-950/80 via-neutral-950/90 to-neutral-950"></div>
              </div>

              <header className="py-20 text-center px-4 relative z-10">
                <h1 className="text-4xl md:text-5xl font-bold text-white mb-4">{t.services.srvTitle}</h1>
                <div className="w-16 h-1 bg-teal-500 mx-auto mb-6"></div>
                <p className="text-neutral-400 max-w-2xl mx-auto text-lg">{t.services.srvDesc}</p>
              </header>

              <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 space-y-8 relative z-10">
                {t.services.items.map((srv, index) => (
                  <div key={index} className="bg-neutral-950/80 backdrop-blur-md border border-neutral-800 p-8 md:p-12 flex flex-col md:flex-row gap-8 items-start hover:border-teal-900 transition-colors rounded-sm group">
                    <div className="w-16 h-16 rounded-sm bg-neutral-900 flex-shrink-0 flex items-center justify-center text-teal-500 group-hover:bg-teal-900/30 transition-colors">
                      {ICONS[index]}
                    </div>
                    <div>
                      <h3 className="text-2xl font-bold text-white mb-3">{srv.title}</h3>
                      <p className="text-neutral-400 leading-relaxed text-lg mb-4">{t.services.items[index].desc}</p>
                      <ul className="space-y-2 text-neutral-300">
                        <li className="flex items-center text-sm"><CheckCircle size={16} className="text-teal-500 mr-2" /> {t.services.srvB1}</li>
                        <li className="flex items-center text-sm"><CheckCircle size={16} className="text-teal-500 mr-2" /> {t.services.srvB2}</li>
                      </ul>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        function AboutView({ t }) {
          return (
            <div className="animate-in fade-in duration-500 relative min-h-screen">
              <div className="fixed inset-0 z-[-1] bg-neutral-950">
                <img 
                  src="Portada-2.png" alt="Background" 
                  className="absolute inset-0 w-full h-full object-cover opacity-20 blur-sm scale-105" 
                />
                <div className="absolute inset-0 bg-gradient-to-b from-neutral-950/80 via-neutral-950/90 to-neutral-950"></div>
              </div>

              <section className="relative py-32 overflow-hidden z-10">
                <div className="absolute right-0 top-0 w-1/2 h-full opacity-10">
                  <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full text-teal-500 fill-current"><polygon points="0,100 100,0 100,100"/></svg>
                </div>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-24 items-center">
                    <div>
                      <h1 className="text-4xl md:text-5xl font-bold text-white mb-6">{t.about.title}</h1>
                      <div className="w-16 h-1 bg-teal-500 mb-8"></div>
                      <h2 className="text-2xl text-teal-400 font-light mb-6">{t.about.sub}</h2>
                      <div className="space-y-6 text-neutral-300 text-lg leading-relaxed font-light">
                        <p dangerouslySetInnerHTML={{ __html: t.about.p1 }}></p>
                        <p>{t.about.p2}</p>
                      </div>
                    </div>
                    <div className="relative mt-8 lg:mt-0 lg:p-8 mx-auto w-full max-w-lg lg:max-w-none">
                      <img src="about-us.png" alt="Studio space" className="w-full rounded-sm shadow-2xl relative z-10" loading="lazy" />
                      <div className="absolute -bottom-6 -left-6 md:-bottom-8 md:-left-2 lg:bottom-0 lg:left-0 w-48 h-48 md:w-64 md:h-64 bg-teal-600 rounded-sm z-0"></div>
                    </div>
                  </div>
                </div>
              </section>

              <section className="py-24 relative z-10">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="text-center mb-16">
                    <h3 className="text-3xl font-bold text-white mb-4">{t.about.processTitle}</h3>
                    <div className="w-16 h-1 bg-teal-500 mx-auto"></div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                    {t.about.steps.map((item, idx) => (
                      <div key={idx} className="relative pt-8">
                        {idx !== t.about.steps.length - 1 && (
                          <div className="hidden md:block absolute top-12 left-1/2 w-full h-[1px] bg-neutral-800"></div>
                        )}
                        <div className="relative z-10 flex flex-col items-center text-center">
                          <div className="w-16 h-16 rounded-full bg-neutral-950 border-2 border-teal-500 flex items-center justify-center text-xl font-bold text-teal-400 mb-6">
                            0{idx + 1}
                          </div>
                          <h4 className="text-xl font-bold text-white mb-3">{item.title}</h4>
                          <p className="text-neutral-400 text-sm px-4">{item.desc}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </div>
          );
        }

        function ContactView({ t }) {
          const handleSubmit = (e) => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const name = formData.get('name');
            const email = formData.get('email');
            const type = formData.get('project_type');
            const message = formData.get('message');
            
            const subject = encodeURIComponent(`Nuevo contacto web: ${name} - ${type}`);
            const body = encodeURIComponent(`Nombre: ${name}\nCorreo de contacto: ${email}\nTipo de Proyecto: ${type}\n\nMensaje:\n${message}`);
            
            window.location.href = `mailto:info@jmm-arquitectura.art?subject=${subject}&body=${body}`;
            form.reset();
          };

          return (
            <div className="animate-in fade-in duration-500 bg-neutral-900 min-h-screen pb-24">
              <header className="py-20 bg-neutral-950 text-center px-4">
                <h1 className="text-4xl md:text-5xl font-bold text-white mb-4">{t.contact.title}</h1>
                <div className="w-16 h-1 bg-teal-500 mx-auto mb-6"></div>
                <p className="text-neutral-400 max-w-2xl mx-auto text-lg">{t.contact.desc}</p>
              </header>

              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16">
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">
                  
                  <div>
                    <h3 className="text-2xl font-bold text-white mb-8">{t.contact.infoTitle}</h3>
                    <div className="space-y-8">
                      <div className="flex items-start">
                        <div className="w-12 h-12 bg-neutral-800/80 backdrop-blur-sm rounded-sm flex items-center justify-center text-teal-500 mr-6 flex-shrink-0">
                          <MessageCircle size={24} />
                        </div>
                        <div>
                          <h4 className="text-neutral-400 text-sm uppercase tracking-wider mb-1">{t.contact.lblPhone}</h4>
                          <a href="https://wa.me/qr/6M5XLFRJM3K6P1" target="_blank" rel="noopener noreferrer" className="text-xl text-white hover:text-teal-400 transition-colors">{t.contact.valPhone}</a>
                        </div>
                      </div>
                      <div className="flex items-start">
                        <div className="w-12 h-12 bg-neutral-800/80 backdrop-blur-sm rounded-sm flex items-center justify-center text-teal-500 mr-6 flex-shrink-0">
                          <Send size={24} />
                        </div>
                        <div>
                          <h4 className="text-neutral-400 text-sm uppercase tracking-wider mb-1">{t.contact.lblTelegram}</h4>
                          <a href="https://t.me/JMM_RENDER_STUDIO" target="_blank" rel="noopener noreferrer" className="text-xl text-white hover:text-teal-400 transition-colors">t.me/JMM_RENDER_STUDIO</a>
                        </div>
                      </div>
                      <div className="flex items-start">
                        <div className="w-12 h-12 bg-neutral-800/80 backdrop-blur-sm rounded-sm flex items-center justify-center text-teal-500 mr-6 flex-shrink-0">
                          <Mail size={24} />
                        </div>
                        <div>
                          <h4 className="text-neutral-400 text-sm uppercase tracking-wider mb-1">{t.contact.lblEmail}</h4>
                          <a href="mailto:info@jmm-arquitectura.art" className="text-xl text-white hover:text-teal-400 transition-colors">info@jmm-arquitectura.art</a>
                        </div>
                      </div>
                      <div className="flex items-start">
                        <div className="w-12 h-12 bg-neutral-800/80 backdrop-blur-sm rounded-sm flex items-center justify-center text-teal-500 mr-6 flex-shrink-0">
                          <Instagram size={24} />
                        </div>
                        <div>
                          <h4 className="text-neutral-400 text-sm uppercase tracking-wider mb-1">{t.contact.lblIg}</h4>
                          <a href="https://instagram.com/jmm_render_studio" target="_blank" rel="noopener noreferrer" className="text-xl text-white hover:text-teal-400 transition-colors">@jmm_render_studio</a>
                        </div>
                      </div>
                      <div className="flex items-start">
                        <div className="w-12 h-12 bg-neutral-800/80 backdrop-blur-sm rounded-sm flex items-center justify-center text-teal-500 mr-6 flex-shrink-0">
                          <Youtube size={24} />
                        </div>
                        <div>
                          <h4 className="text-neutral-400 text-sm uppercase tracking-wider mb-1">{t.contact.lblYoutube}</h4>
                          <a href="https://www.youtube.com/@JMM_CR" target="_blank" rel="noopener noreferrer" className="text-xl text-white hover:text-teal-400 transition-colors">@JMM_CR</a>
                        </div>
                      </div>
                    </div>
                    <div className="mt-12 p-8 bg-neutral-950 border border-neutral-800 rounded-sm">
                      <p className="text-neutral-300 italic">{t.contact.quote}</p>
                    </div>
                  </div>

                  <div className="bg-neutral-950 p-8 md:p-10 rounded-sm border border-neutral-800">
                    <h3 className="text-2xl font-bold text-white mb-8">{t.contact.formTitle}</h3>
                    <form onSubmit={handleSubmit} className="space-y-6">
                      <div>
                        <label className="block text-sm font-medium text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.name}</label>
                        <input name="name" type="text" required className="w-full bg-neutral-900 border border-neutral-700 rounded-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors" placeholder={t.contact.namePh} />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.email}</label>
                        <input name="email" type="email" required className="w-full bg-neutral-900 border border-neutral-700 rounded-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors" placeholder={t.contact.emailPh} />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.type}</label>
                        <select name="project_type" className="w-full bg-neutral-900 border border-neutral-700 rounded-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors appearance-none">
                          {t.contact.typeOpt.map((opt, idx) => (
                            <option key={idx} value={idx === 0 ? "" : opt}>{opt}</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.msg}</label>
                        <textarea name="message" rows="4" required className="w-full bg-neutral-900 border border-neutral-700 rounded-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors resize-none" placeholder={t.contact.msgPh}></textarea>
                      </div>
                      <button type="submit" className="w-full bg-teal-600 hover:bg-teal-500 text-white font-medium uppercase tracking-widest py-4 rounded-sm transition-colors mt-4">
                        {t.contact.submit}
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
