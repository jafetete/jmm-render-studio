            animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        // --- COMPONENTE DE ANIMACIÓN SCROLL ---
        const Reveal = ({ children, delay = 0, direction = 'up', className = '', onClick }) => {
          const [isVisible, setIsVisible] = useState(false);
          const ref = useRef(null);

          useEffect(() => {
            const observer = new IntersectionObserver(
              ([entry]) => {
                if (entry.isIntersecting) {
                  setIsVisible(true);
                  observer.unobserve(entry.target);
                }
              },
              { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
            );
            if (ref.current) observer.observe(ref.current);
            return () => { if (ref.current) observer.unobserve(ref.current); };
          }, []);

          let transformBase = 'translate-y-12';
          if (direction === 'down') transformBase = '-translate-y-12';
          if (direction === 'left') transformBase = '-translate-x-12';
          if (direction === 'right') transformBase = 'translate-x-12';
          if (direction === 'none') transformBase = 'scale-95';

          const transformActive = direction === 'none' ? 'scale-100' : 'translate-x-0 translate-y-0';

          return (
            <div
              ref={ref}
              onClick={onClick}
              className={`transition-all duration-[1200ms] cubic-bezier(0.16, 1, 0.3, 1) ${className} ${
                isVisible ? `opacity-100 ${transformActive}` : `opacity-0 ${transformBase}`
              }`}
              style={{ transitionDelay: `${delay}ms` }}
            >
              {children}
            </div>
          );
        };

          const [activeProject, setActiveProject] = useState(null);
          const [currentImageIndex, setCurrentImageIndex] = useState(0);
          const [isGalleryPaused, setIsGalleryPaused] = useState(false);
          const [lang, setLang] = useState('es');

          const t = TRANSLATIONS[lang];

          useEffect(() => {
            window.scrollTo(0, 0);
          }, [currentPage]);

          // Autoplay para la galería
          useEffect(() => {
            if (!activeProject || activeProject.gallery.length <= 1 || isGalleryPaused) return;
            const timer = setTimeout(() => {
              setCurrentImageIndex((prev) => (prev === activeProject.gallery.length - 1 ? 0 : prev + 1));
            }, 2500);
            return () => clearTimeout(timer);
          }, [activeProject, currentImageIndex, isGalleryPaused]);

          const navigateTo = (page) => {
            setCurrentPage(page);
            setIsMobileMenuOpen(false);
          };

          const toggleLanguage = () => {
            setLang(prev => prev === 'en' ? 'es' : 'en');
          };

          const openGallery = (project) => {
            setActiveProject(project);
            setCurrentImageIndex(0);
          };

          const closeGallery = () => setActiveProject(null);

          const nextImage = (e) => {
            e.stopPropagation();
            if (activeProject && activeProject.gallery.length > 0) {
              setCurrentImageIndex((prev) => (prev === activeProject.gallery.length - 1 ? 0 : prev + 1));
            }
          };

          const prevImage = (e) => {
            e.stopPropagation();
            if (activeProject && activeProject.gallery.length > 0) {
              setCurrentImageIndex((prev) => (prev === 0 ? activeProject.gallery.length - 1 : prev - 1));
            }
          };

                        >

                      <div className="h-5 w-px bg-neutral-700 mx-2"></div>
                      <button onClick={toggleLanguage} className="flex items-center text-sm font-bold text-teal-400 hover:text-white transition-colors">
                        <Globe size={18} className="mr-1.5" /> {lang === 'en' ? 'ES' : 'EN'}
                      </button>
                    </div>

                    <div className="md:hidden flex items-center space-x-6 initial-fade-up">
                      <button onClick={toggleLanguage} className="flex items-center text-sm font-bold text-teal-400 hover:text-white">

        function ContactView({ t }) {
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [submitMessage, setSubmitMessage] = useState('');

          const handleSubmit = async (e) => {
            e.preventDefault();
            setIsSubmitting(true);
            setSubmitMessage('');
            
            const form = e.target;
            const formData = new FormData(form);
            
            try {
              const response = await fetch("https://api.web3forms.com/submit", {
                method: "POST",
                headers: {
                  "Accept": "application/json"
                },
                body: formData
              });
              
              const data = await response.json();
              
              if (response.status === 200 || data.success) {
                setSubmitMessage('success');
                form.reset();
              } else {
                setSubmitMessage('error');
              }
            } catch (error) {
              setSubmitMessage('error');
            } finally {
              setIsSubmitting(false);
              setTimeout(() => setSubmitMessage(''), 7000);
            }
          };

          return (

                        <div>
                          <label className="block text-sm font-medium text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.name}</label>
                          <input name="name" type="text" required className="w-full bg-neutral-900 border border-neutral-700 rounded-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors" placeholder={t.contact.namePh} />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.email}</label>
                          <input name="email" type="email" required className="w-full bg-neutral-900 border border-neutral-700 rounded-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors" placeholder={t.contact.emailPh} />
                        </div>
                        
                        <div>
                          <label className="block text-sm font-medium text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.phone}</label>
                          <div className="flex">
                            <select name="country_code" className="bg-neutral-900 border border-neutral-700 rounded-l-sm px-2 md:px-3 py-3 text-white focus:outline-none focus:border-teal-500 transition-colors border-r-0 cursor-pointer">
                              <option value="+506">🇨🇷 +506</option>
                              <option value="+1">🇺🇸 +1</option>
                              <option value="+52">🇲🇽 +52</option>
                              <option value="+34">🇪🇸 +34</option>
                              <option value="+57">🇨🇴 +57</option>
                              <option value="+54">🇦🇷 +54</option>
                              <option value="+51">🇵🇪 +51</option>
                              <option value="+56">🇨🇱 +56</option>
                              <option value="+507">🇵🇦 +507</option>
                            </select>
                            <input name="phone" type="tel" className="w-full bg-neutral-900 border border-neutral-700 rounded-r-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors" placeholder={t.contact.phonePh} />
                          </div>
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.type}</label>
                          <select name="project_type" className="w-full bg-neutral-900 border border-neutral-700 rounded-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors appearance-none cursor-pointer">
                            {t.contact.typeOpt.map((opt, idx) => (
                              <option key={idx} value={idx === 0 ? "" : opt}>{opt}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.msg}</label>
                          <textarea name="message" rows="4" required className="w-full bg-neutral-900 border border-neutral-700 rounded-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors resize-none" placeholder={t.contact.msgPh}></textarea>
                        </div>
                        
                        <button type="submit" disabled={isSubmitting} className={`w-full font-medium uppercase tracking-widest py-4 rounded-sm transition-all mt-4 flex justify-center items-center ${isSubmitting ? 'bg-teal-800 text-teal-200 cursor-not-allowed' : 'bg-teal-600 hover:bg-teal-500 text-white hover:scale-[1.02] hover:shadow-[0_0_20px_rgba(13,148,136,0.4)]'}`}>
                          {isSubmitting ? 'Enviando...' : t.contact.submit}
                        </button>

                        {submitMessage === 'success' && (
                          <div className="p-4 bg-teal-900/50 border border-teal-500 rounded-sm text-teal-300 text-sm text-center mt-4 fade-in">
                            {t.contact.successMsg}
                          </div>
                        )}
                        {submitMessage === 'error' && (
                          <div className="p-4 bg-red-900/50 border border-red-500 rounded-sm text-red-300 text-sm text-center mt-4 fade-in">
                            {t.contact.errorMsg}
                          </div>
                        )}
                      </form>
                    </div>
                  </Reveal>
                </div>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
