    <script>
      window.jmmTab = function(btn, key) {
        const wrapper = btn.closest('.jmm-tabs-wrapper');
        wrapper.querySelectorAll('.jmm-tab-btn').forEach(b => b.classList.remove('active'));
        wrapper.querySelectorAll('.jmm-tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        wrapper.querySelector('#jmm-panel-' + key).classList.add('active');
      };

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Menu, X, Instagram, Phone, Mail, 
          MapPin, PenTool, Ruler, FileText, 
          Maximize, ChevronRight, ChevronLeft,
          Monitor, Armchair, Globe, MessageCircle, Send, Camera, ArrowRight
        } from 'lucide-react';

        function Viewer360() {
            return (
                <div className="relative w-full h-80 md:h-[500px] rounded-sm border border-neutral-800 overflow-hidden bg-neutral-950">
                    <iframe width="100%" height="100%" frameBorder="0" allow="xr-spatial-tracking; gyroscope; accelerometer" allowFullScreen scrolling="no" src="https://kuula.co/share/LGkH6?logo=1&info=1&fs=1&vr=0&zoom=1&sd=1&thumbs=1" className="w-full h-full"></iframe>
                </div>
            );
        }

        function ImageSlider({ beforeSrc, afterSrc, beforeLabel, afterLabel }) {
            const [position, setPosition] = useState(50);
            const [isDragging, setIsDragging] = useState(false);
            const containerRef = useRef(null);

            const handleMove = (clientX) => {
                if (!isDragging || !containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
                const percent = (x / rect.width) * 100;
                setPosition(percent);
            };

            const onMouseMove = (e) => handleMove(e.clientX);
            const onTouchMove = (e) => handleMove(e.touches[0].clientX);

            useEffect(() => {
                const handleMouseUp = () => setIsDragging(false);
                if (isDragging) {
                    window.addEventListener('mouseup', handleMouseUp);
                    window.addEventListener('touchend', handleMouseUp);
                }
                return () => {
                    window.removeEventListener('mouseup', handleMouseUp);
                    window.removeEventListener('touchend', handleMouseUp);
                };
            }, [isDragging]);

            return (
                <div 
                    ref={containerRef}
                    className="relative w-full h-80 md:h-[500px] rounded-sm overflow-hidden select-none cursor-ew-resize border border-neutral-800 bg-neutral-950 group"
                    onMouseDown={() => setIsDragging(true)}
                    onTouchStart={(e) => { setIsDragging(true); handleMove(e.touches[0].clientX); }}
                    onMouseMove={onMouseMove}
                    onTouchMove={onTouchMove}
                    onClick={(e) => e.stopPropagation()}
                >
                    <img src={afterSrc} alt={afterLabel} className="absolute inset-0 w-full h-full object-cover object-center pointer-events-none" draggable="false" onError={(e) => { e.target.style.display='none'; }} />
                    <div className="absolute bottom-4 right-4 px-3 py-1.5 text-xs text-white rounded-sm z-10 font-medium pointer-events-none text-shadow-strong">{afterLabel}</div>

        const Reveal = ({ children, delay = 0, direction = 'up', className = '', onClick }) => {
          const [isVisible, setIsVisible] = useState(false);
          const ref = useRef(null);

          useEffect(() => {
            const observer = new IntersectionObserver(([entry]) => {
                if (entry.isIntersecting) {
                  setIsVisible(true);
                  observer.unobserve(entry.target);
                }
              }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
            if (ref.current) observer.observe(ref.current);
            return () => { if (ref.current) observer.unobserve(ref.current); };
          }, []);

          let transformBase = 'translate-y-12';
          if (direction === 'down') transformBase = '-translate-y-12';
          if (direction === 'left') transformBase = '-translate-x-12';
          if (direction === 'right') transformBase = 'translate-x-12';
          if (direction === 'none') transformBase = 'scale-95';
          const transformActive = direction === 'none' ? 'scale-100' : 'translate-x-0 translate-y-0';

          return (
            <div ref={ref} onClick={onClick} className={`transition-all duration-[1200ms] cubic-bezier(0.16, 1, 0.3, 1) ${className} ${isVisible ? `opacity-100 ${transformActive}` : `opacity-0 ${transformBase}`}`} style={{ transitionDelay: `${delay}ms` }}>
              {children}
            </div>
          );

        function ServicesView({ t }) {
          const [expandedIndex, setExpandedIndex] = useState(null);
          const itemRefs = useRef([]); 

          const toggleExpand = (idx) => {
            if (expandedIndex === idx) {
              setExpandedIndex(null);
            } else {
              setExpandedIndex(idx);
              setTimeout(() => {
                if (itemRefs.current[idx]) {
                  const navHeight = window.innerWidth < 768 ? 96 : 128;
                  const element = itemRefs.current[idx];
                  const y = element.getBoundingClientRect().top + window.scrollY - navHeight - 20;
                  window.scrollTo({ top: y, behavior: 'smooth' });
                }
              }, 510); 
            }
          };

          const renderExpandedContent = (idx) => {
            const details = t.services.details[idx];
            
            switch(idx) {
              case 0:
                return (
                  <div className="mt-8 pt-6 border-t border-neutral-800 animate-in fade-in duration-500">
                    <p className="text-teal-400 font-body mb-6">{details.text}</p>
                    <div className="grid grid-cols-1 gap-6">
                      <div className="bg-neutral-950 rounded-sm relative group overflow-hidden border border-neutral-800 min-h-[300px]">

        function ContactView({ t }) {
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [submitMessage, setSubmitMessage] = useState('');

          const handleSubmit = async (e) => {
            e.preventDefault();
            setIsSubmitting(true);
            setSubmitMessage('');
            
            const form = e.target;
            const formData = new FormData(form);
            
            try {
              const response = await fetch("https://api.web3forms.com/submit", {
                method: "POST",
                headers: {
                  "Accept": "application/json"
                },
                body: formData
              });
              
              const data = await response.json();
              
              if (response.status === 200 || data.success) {
                setSubmitMessage('success');
                form.reset();
              } else {
                setSubmitMessage('error');
              }
            } catch (error) {
              setSubmitMessage('error');
            } finally {
              setIsSubmitting(false);
              setTimeout(() => setSubmitMessage(''), 7000);
            }

            <div className="animate-in fade-in duration-500 relative min-h-screen pb-24 overflow-hidden">

                        <div>
                          <label className="block text-sm font-heading text-neutral-400 mb-2 uppercase tracking-wide">{t.contact.msg}</label>
                          <textarea name="message" rows="4" required className="w-full bg-neutral-900 border border-neutral-700 rounded-sm px-4 py-3 text-white focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors resize-none" placeholder={t.contact.msgPh}></textarea>
                        </div>
                        
                        <button type="submit" disabled={isSubmitting} className={`w-full font-heading uppercase tracking-widest py-4 rounded-sm transition-all mt-4 flex justify-center items-center ${isSubmitting ? 'bg-teal-800 text-teal-200 cursor-not-allowed' : 'bg-teal-600 hover:bg-teal-500 text-white hover:scale-[1.02] hover:shadow-[0_0_20px_rgba(13,148,136,0.4)]'}`}>
                          {isSubmitting ? 'Enviando...' : t.contact.submit}
                        </button>

                        {submitMessage === 'success' && (
                          <div className="p-4 bg-teal-900/50 border border-teal-500 rounded-sm text-teal-300 text-sm text-center mt-4 fade-in">
                            {t.contact.successMsg}
                          </div>
                        )}
                        {submitMessage === 'error' && (
                          <div className="p-4 bg-red-900/50 border border-red-500 rounded-sm text-red-300 text-sm text-center mt-4 fade-in">
                            {t.contact.errorMsg}
                          </div>
                        )}
                      </form>
                    </div>
                  </Reveal>
                </div>
              </div>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
    if (window.matchMedia("(pointer: fine)").matches) {
        const cursor = document.getElementById('customCursor');
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top  = mouseY + 'px';
        });

        document.addEventListener('mouseover', (e) => {
            const el = e.target.closest('button, a, [class*="cursor-pointer"], input, select, textarea, label');
            if (el) document.body.classList.add('cursor-hover');
            else document.body.classList.remove('cursor-hover');
        });
        document.addEventListener('mouseleave', () => {
            cursor.style.opacity = '0';
        });
        document.addEventListener('mouseenter', () => {
            cursor.style.opacity = '1';
        });
    }

    const scrollBar = document.getElementById('scrollProgress');
    window.addEventListener('scroll', () => {
        const scrollTop = document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const progress = scrollTop / docHeight;
        scrollBar.style.width = (progress * 100) + '%';
    }, { passive: true });

    function spawnParticles() {
        const hero = document.querySelector('section');
        if (!hero) { setTimeout(spawnParticles, 500); return; }
        for (let i = 0; i < 22; i++) {
            const p = document.createElement('div');
            p.className = 'hero-particle';
            const size = Math.random() * 3 + 1;
            p.style.cssText = `
                left: ${Math.random() * 100}%;
                bottom: -10px;
                width: ${size}px;
                height: ${size}px;
                animation-duration: ${Math.random() * 14 + 8}s;
                animation-delay: ${Math.random() * 8}s;
                opacity: 0;
            `;
            hero.appendChild(p);
        }
    }
    setTimeout(spawnParticles, 400);

    function animateCounter(el) {
        const target = parseInt(el.getAttribute('data-target'), 10);
        const duration = 1800;
        const start = performance.now();
        function update(now) {
            const elapsed = now - start;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            el.textContent = Math.floor(eased * target);
            if (progress < 1) requestAnimationFrame(update);
            else el.textContent = target + (el.getAttribute('data-suffix') || '');
        }
        requestAnimationFrame(update);
    }

    const counterObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !entry.target.dataset.counted) {
                entry.target.dataset.counted = 'true';
                animateCounter(entry.target);
            }
        });
    }, { threshold: 0.5 });

    function observeCounters() {
        document.querySelectorAll('[data-target]').forEach(el => counterObserver.observe(el));
    }

    function enhanceNavLinks() {
        document.querySelectorAll('nav button').forEach(btn => {
            if (!btn.classList.contains('nav-link-animated')) {
                btn.classList.add('nav-link-animated');
            }
        });
    }

    function init3DCards() {
        document.querySelectorAll('.group.relative.overflow-hidden').forEach(card => {
            if (card.dataset.tilt3d) return;
            card.dataset.tilt3d = '1';
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top)  / rect.height - 0.5;
                card.style.transform = `perspective(800px) rotateX(${-y * 8}deg) rotateY(${x * 8}deg) scale(1.02)`;
                card.style.transition = 'transform 0.1s ease';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(800px) rotateX(0) rotateY(0) scale(1)';
                card.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            });
        });
    }

    function applyPulseGlow() {
        document.querySelectorAll('button.bg-teal-600, button.bg-teal-500').forEach(btn => {
            if (!btn.classList.contains('pulse-glow')) btn.classList.add('pulse-glow', 'btn-ripple');
        });
    }

    function addScanline() {
        const hero = document.querySelector('section.relative');
        if (hero && !hero.querySelector('.hero-scanline')) {
            const sl = document.createElement('div');
            sl.className = 'hero-scanline';
            hero.appendChild(sl);
        }
    }
    setTimeout(addScanline, 600);

    function enhanceFooter() {
        document.querySelectorAll('footer img').forEach(img => {
            if (!img.classList.contains('footer-logo-float')) {
                img.classList.add('footer-logo-float');
            }
        });
    }

    function addNoiseToHero() {
        const hero = document.querySelector('section.relative');
        if (hero && !hero.classList.contains('noise-overlay')) {
            hero.classList.add('noise-overlay');
        }
    }
    setTimeout(addNoiseToHero, 500);

    function enhanceContactIcons() {
        document.querySelectorAll('.flex.items-start.group').forEach(row => {
            const iconWrap = row.querySelector('.w-12');
            if (iconWrap && !iconWrap.classList.contains('contact-icon-wrap')) {
                iconWrap.classList.add('contact-icon-wrap');
                const inner = iconWrap.querySelector('svg');
                if (inner) inner.classList.add('contact-icon-inner');
            }
        });
    }

    document.addEventListener('load', (e) => {
        if (e.target.tagName === 'IMG' && !e.target.classList.contains('reveal-blur-in')) {
            e.target.classList.add('reveal-blur-in');
        }
    }, true);

    const style = document.createElement('style');
    style.textContent = `
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        main > div {
            animation: pageIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both !important;
        }
    `;
    document.head.appendChild(style);

    // Sistema unificado de Observación para UI dinámica (Rendimiento optimizado)
    const uiObserver = new MutationObserver((mutations) => {
        let shouldUpdate = false;
        for (const m of mutations) {
            if (m.addedNodes.length > 0) {
                shouldUpdate = true;
                break;
            }
        }
        if (shouldUpdate) {
            observeCounters();
            init3DCards();
            applyPulseGlow();
            enhanceNavLinks();
            enhanceFooter();
            enhanceContactIcons();
        }
    });
    uiObserver.observe(document.body, { childList: true, subtree: true });

    // Inicialización al cargar la primera vez
    setTimeout(() => {
        observeCounters();
        init3DCards();
        applyPulseGlow();
        enhanceNavLinks();
        enhanceFooter();
        enhanceContactIcons();
    }, 800);

    </script>
</body>
</html>
